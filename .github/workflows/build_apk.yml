name: Build SnapShot Pro APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project & Configure SnapShot Pro
        run: |
          flutter create . --platforms=android --org com.bhavinsuthar.snapshotpro
          
          # Python Script to configure Permissions, App Name, and Snapchat Style Icon
          python3 -c "
          import os

          # 1. Update AndroidManifest.xml for Permissions and Name 'SnapShot Pro'
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>
          '''
          content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">' + perms)
          content = content.replace('android:label=\"photo_editor_app\"', 'android:label=\"SnapShot Pro\"')
          with open(manifest_path, 'w') as f:
              f.write(content)

          # 2. Generate Iconic Snapchat Yellow Vector Icon
          svg_content = '''<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"
              android:width=\"108dp\"
              android:height=\"108dp\"
              android:viewportWidth=\"108\"
              android:viewportHeight=\"108\">
              <path android:fillColor=\"#FFFFFC00\" android:pathData=\"M0,0h108v108h-108z\"/>
              <path android:fillColor=\"#FFFFFF\" android:pathData=\"M54,24c-14.36,0 -26,11.64 -26,26c0,11.23 7.1,20.8 17.07,24.42c1.3,0.48 2.93,1.58 2.93,3.58c0,2 -2,4 -6,6c-1.5,0.75 -3,2 -3,4c0,2.5 3,3 6,3c5,0 9,-2 11,-4c1,-1 3,-1 4,0c2,2 6,4 11,4c3,0 6,-0.5 6,-3c0,-2 -1.5,-3.25 -3,-4c-4,-2 -6,-4 -6,-6c0,-2 1.63,-3.1 2.93,-3.58c9.97,-3.62 17.07,-13.19 17.07,-24.42c0,-14.36 -11.64,-26 -26,-26z\"/>
          </vector>'''

          drawable_dir = 'android/app/src/main/res/drawable'
          os.makedirs(drawable_dir, exist_ok=True)
          with open(os.path.join(drawable_dir, 'ic_launcher_foreground.xml'), 'w') as f:
              f.write(svg_content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=minSdkVersion=21

      - name: Build Release AAB (App Bundle)
        run: flutter build appbundle --release --dart-define=minSdkVersion=21

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: SnapShot-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB File (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: SnapShot-Pro-AAB
          path: build/app/outputs/bundle/release/app-release.aab

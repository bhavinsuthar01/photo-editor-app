name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project
        run: |
          flutter create . --platforms=android --org com.bhavinsuthar.photoeditor
          
          # Add Camera & Storage permissions
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>
          '''
          content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">' + perms)
          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK with minSdk 21
        run: flutter build apk --release --dart-define=minSdkVersion=21

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapEdit-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build SnapShot Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Project & Iconic Launcher
        run: |
          flutter create . --platforms=android --org com.bhavinsuthar.snapshotpro
          
          python3 -c "
          import os

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\"/>
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>
          '''
          content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">' + perms)
          content = content.replace('android:label=\"photo_editor_app\"', 'android:label=\"SnapShot Pro\"')
          with open(manifest_path, 'w') as f:
              f.write(content)

          svg_icon = '''<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"
              android:width=\"108dp\"
              android:height=\"108dp\"
              android:viewportWidth=\"108\"
              android:viewportHeight=\"108\">
              <path android:fillColor=\"#FFFFFC00\" android:pathData=\"M0,0h108v108h-108z\"/>
              <path android:fillColor=\"#FFFFFF\" android:pathData=\"M54,20c-15.46,0 -28,12.54 -28,28c0,12.1 7.65,22.4 18.38,26.3c1.4,0.52 3.16,1.7 3.16,3.86c0,2.16 -2.16,4.32 -6.46,6.48c-1.62,0.81 -3.24,2.16 -3.24,4.32c0,2.7 3.24,3.24 6.48,3.24c5.4,0 9.72,-2.16 11.88,-4.32c1.08,-1.08 3.24,-1.08 4.32,0c2.16,2.16 6.48,4.32 11.88,4.32c3.24,0 6.48,-0.54 6.48,-3.24c0,-2.16 -1.62,-3.51 -3.24,-4.32c-4.32,-2.16 -6.48,-4.32 -6.48,-6.48c0,-2.16 1.76,-3.34 3.16,-3.86c10.73,-3.9 18.38,-14.2 18.38,-26.3c0,-15.46 -12.54,-28 -28,-28z\"/>
          </vector>'''

          res_dir = 'android/app/src/main/res'
          for d in ['drawable', 'mipmap-anydpi-v26']:
              p = os.path.join(res_dir, d)
              os.makedirs(p, exist_ok=True)
              with open(os.path.join(p, 'ic_launcher.xml'), 'w') as f:
                  f.write(svg_icon)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --dart-define=minSdkVersion=21

      - name: Build Release AAB
        run: flutter build appbundle --release --dart-define=minSdkVersion=21

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapShot-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: SnapShot-Pro-AAB
          path: build/app/outputs/bundle/release/app-release.aab
